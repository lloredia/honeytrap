[workspace]
resolver = "2"
members = [
    "honeypots/ssh",
    "collector",
    "shared",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["lesley oredialesley@gmail.com"]
license = "MIT"
repository = "https://github.com/your-org/honeytrap"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }

# SSH
russh = "0.43"
russh-keys = "0.43"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# GeoIP
maxminddb = "0.24"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
base64 = "0.21"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
dashmap = "5.5"
parking_lot = "0.12"

# Testing
mockall = "0.12"
