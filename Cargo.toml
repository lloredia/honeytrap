[workspace]
resolver = "2"
members = [
    "honeypots/ssh",
    "collector",
    "shared",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["lesley oredialesley@gmail.com"]
license = "MIT"
repository = "https://github.com/lloredia/honeytrap"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# SSH. 0.60.3+ fixes RUSTSEC-2026-0154 (unbounded allocation).
# RSA is left off: the `rsa` crate has no fix for RUSTSEC-2023-0071
# (Marvin timing attack) and this process is meant to face the network.
# Host keys are Ed25519.
russh = { version = "0.64", default-features = false, features = ["flate2", "aws-lc-rs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# GeoIP
maxminddb = "0.24"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
dashmap = "5.5"
parking_lot = "0.12"

# Testing
mockall = "0.12"
