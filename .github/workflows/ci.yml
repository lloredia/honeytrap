name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  python:
    name: Python tools
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest

  docker:
    name: Docker and Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build honeypot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: honeypot
          load: true
          tags: honeytrap-ssh:ci
          cache-from: type=gha,scope=honeytrap
          cache-to: type=gha,scope=honeytrap,mode=max
      - name: Build collector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: collector
          load: true
          tags: honeytrap-collector:ci
          cache-from: type=gha,scope=honeytrap
          cache-to: type=gha,scope=honeytrap,mode=max
      - name: Scan honeypot
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: honeytrap-ssh:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Scan collector
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: honeytrap-collector:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
