version: '3.8'

services:
  honeypot-ssh:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: honeytrap-ssh
    ports:
      - "2222:2222"
      - "9100:9100"
    environment:
      - RUST_LOG=info
    volumes:
      - ssh-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: honeytrap-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: honeytrap-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

volumes:
  ssh-data:
